name: Ubuntu release candidate

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing stable vX.Y.Z tag
        required: true
        type: string
      source_commit:
        description: Independently known exact 40-hex source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ubuntu-candidate-${{ inputs.source_tag }}
  cancel-in-progress: false

jobs:
  source:
    name: Verify remote tag and freeze source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.freeze.outputs.tag }}
      commit: ${{ steps.freeze.outputs.commit }}
      source_inputs_sha256: ${{ steps.freeze.outputs.source_inputs_sha256 }}
    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          persist_github_token: false
          cache: false
      - name: Refuse absent or moved remote source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/workflow-cli.mjs remote "$GITHUB_REPOSITORY" "$SOURCE_TAG" "$SOURCE_COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          path: candidate-source
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          working_directory: candidate-source
          persist_github_token: false
          cache: false
      - name: Freeze exact source and recheck remote identity
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 candidate-source/var
          ./candidate-source/scripts/record-release-inputs "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/candidate-source/var/release-inputs"
          mise exec -- node release/workflow-cli.mjs record "$GITHUB_REPOSITORY" "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/candidate-source" "$PWD/candidate-source/var/release-inputs/source-inputs.json" >> "$GITHUB_OUTPUT"

  ubuntu:
    name: Ubuntu 24.04 ${{ matrix.architecture }} candidate
    needs: source
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_TAG: ${{ needs.source.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      SOURCE_INPUTS_SHA256: ${{ needs.source.outputs.source_inputs_sha256 }}
      TARGET_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          persist_github_token: false
          cache: false
      - name: Admit the selected native target
        run: |
          test "$(. /etc/os-release; printf '%s:%s' "$ID" "$VERSION_ID")" = ubuntu:24.04
          test "$(dpkg --print-architecture)" = "$TARGET_ARCHITECTURE"
          daemon_architecture=$(docker info --format '{{.Architecture}}')
          case "$TARGET_ARCHITECTURE:$daemon_architecture" in
            amd64:x86_64|amd64:amd64|arm64:aarch64|arm64:arm64) ;;
            *) exit 1 ;;
          esac
      - name: Freeze and match source-job inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 var
          ./scripts/record-release-inputs "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs"
          node release/workflow-cli.mjs verify "$GITHUB_REPOSITORY" "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD" "$PWD/var/release-inputs/source-inputs.json" "$SOURCE_INPUTS_SHA256"
      - name: Fetch exact locked build material
        run: |
          install -d -m 700 "$RUNNER_TEMP/frameshift-hex" "$RUNNER_TEMP/frameshift-gleam-cache"
          printf 'HEX_HOME=%s\nXDG_CACHE_HOME=%s\n' "$RUNNER_TEMP/frameshift-hex" "$RUNNER_TEMP/frameshift-gleam-cache" >> "$GITHUB_ENV"
          export HEX_HOME="$RUNNER_TEMP/frameshift-hex"
          export XDG_CACHE_HOME="$RUNNER_TEMP/frameshift-gleam-cache"
          cd apps/core
          mix local.hex 2.5.1 --force
          mix local.rebar --force
          mix deps.get --check-locked
          cd ../../packages/decision-kernel
          gleam deps download
      - name: Prepare and verify locked dependency sources
        id: material
        run: |
          ./scripts/prepare-gleam-metadata "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json"
          ./scripts/check-core-material "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$HEX_HOME/packages/hexpm" "$PWD/var/core-material"
          ./scripts/check-gleam-material "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$XDG_CACHE_HOME/gleam/hex/hexpm/packages" "$PWD/var/gleam-material"
          core_sha256=$(sha256sum var/core-material/core-material.json | cut -d ' ' -f 1)
          gleam_sha256=$(sha256sum var/gleam-material/gleam-material.json | cut -d ' ' -f 1)
          printf 'core_receipt_sha256=%s\ngleam_receipt_sha256=%s\n' "$core_sha256" "$gleam_sha256" >> "$GITHUB_OUTPUT"
      - name: Build the tagged target candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/package-linux-candidate "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$TARGET_ARCHITECTURE" "$PWD/var/ubuntu-candidate"
      - name: Install and check exact candidate bytes
        run: ./scripts/check-linux-candidate "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$TARGET_ARCHITECTURE" "$PWD/var/ubuntu-candidate"
      - name: Replay source receipts and join captured dependency inputs
        id: joined
        env:
          CORE_SHA256: ${{ steps.material.outputs.core_receipt_sha256 }}
          GLEAM_SHA256: ${{ steps.material.outputs.gleam_receipt_sha256 }}
        run: |
          ./scripts/check-core-material "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$HEX_HOME/packages/hexpm" "$PWD/var/core-material"
          ./scripts/check-gleam-material "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$XDG_CACHE_HOME/gleam/hex/hexpm/packages" "$PWD/var/gleam-material"
          candidate_sha256=$(sha256sum var/ubuntu-candidate/candidate.json | cut -d ' ' -f 1)
          ./scripts/check-linux-material "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$TARGET_ARCHITECTURE" "$PWD/var/ubuntu-candidate" "$candidate_sha256" "$PWD/var/core-material/core-material.json" "$CORE_SHA256" "$PWD/var/gleam-material/gleam-material.json" "$GLEAM_SHA256" "$PWD/var/dependency-inputs"
          joined_sha256=$(sha256sum var/dependency-inputs/dependency-inputs.json | cut -d ' ' -f 1)
          printf 'candidate_record_sha256=%s\ndependency_inputs_sha256=%s\n' "$candidate_sha256" "$joined_sha256" >> "$GITHUB_OUTPUT"
      - name: Recheck remote identity before transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/workflow-cli.mjs verify "$GITHUB_REPOSITORY" "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD" "$PWD/var/release-inputs/source-inputs.json" "$SOURCE_INPUTS_SHA256"
      - name: Preserve and receive exact candidate and source evidence bytes
        id: archive
        env:
          CANDIDATE_SHA256: ${{ steps.joined.outputs.candidate_record_sha256 }}
          CORE_SHA256: ${{ steps.material.outputs.core_receipt_sha256 }}
          GLEAM_SHA256: ${{ steps.material.outputs.gleam_receipt_sha256 }}
          JOIN_SHA256: ${{ steps.joined.outputs.dependency_inputs_sha256 }}
        run: |
          tar --format=ustar --hard-dereference -cf var/ubuntu-candidate.tar -C var ubuntu-candidate
          chmod 600 var/ubuntu-candidate.tar
          ./scripts/package-linux-candidate "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$TARGET_ARCHITECTURE" "$PWD/var/ubuntu-candidate"
          archive_sha256=$(sha256sum var/ubuntu-candidate.tar | cut -d ' ' -f 1)
          ./scripts/stage-linux-candidate "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$TARGET_ARCHITECTURE" "$PWD/var/ubuntu-candidate.tar" "$archive_sha256" "$PWD/var/archive-handoff"
          install -d -m 700 var/ubuntu-material
          install -m 600 var/core-material/core-material.json var/ubuntu-material/core-material.json
          install -m 600 var/gleam-material/gleam-material.json var/ubuntu-material/gleam-material.json
          install -m 600 var/dependency-inputs/dependency-inputs.json var/ubuntu-material/dependency-inputs.json
          tar --format=ustar --hard-dereference -cf var/ubuntu-material.tar -C var ubuntu-material
          chmod 600 var/ubuntu-material.tar
          material_archive_sha256=$(sha256sum var/ubuntu-material.tar | cut -d ' ' -f 1)
          ./scripts/stage-linux-material "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD/var/release-inputs/source-inputs.json" "$TARGET_ARCHITECTURE" "$PWD/var/archive-handoff/ubuntu-candidate" "$CANDIDATE_SHA256" "$PWD/var/ubuntu-material.tar" "$material_archive_sha256" "$CORE_SHA256" "$GLEAM_SHA256" "$JOIN_SHA256" "$PWD/var/material-handoff"
          printf 'archive_sha256=%s\nmaterial_archive_sha256=%s\n' "$archive_sha256" "$material_archive_sha256" >> "$GITHUB_OUTPUT"
      - name: Recheck remote identity after both receivers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/workflow-cli.mjs verify "$GITHUB_REPOSITORY" "$SOURCE_TAG" "$SOURCE_COMMIT" "$PWD" "$PWD/var/release-inputs/source-inputs.json" "$SOURCE_INPUTS_SHA256"
      - name: Verify retained archive digests before upload
        env:
          ARCHIVE_SHA256: ${{ steps.archive.outputs.archive_sha256 }}
          MATERIAL_ARCHIVE_SHA256: ${{ steps.archive.outputs.material_archive_sha256 }}
        run: |
          test "$(sha256sum var/ubuntu-candidate.tar | cut -d ' ' -f 1)" = "$ARCHIVE_SHA256"
          test "$(sha256sum var/ubuntu-material.tar | cut -d ' ' -f 1)" = "$MATERIAL_ARCHIVE_SHA256"
      - name: Retain an independent candidate attempt
        id: retain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-${{ matrix.architecture }}-candidate-${{ needs.source.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ubuntu-candidate.tar
          archive: false
          overwrite: false
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently verified source evidence
        id: retain-material
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-${{ matrix.architecture }}-source-evidence-${{ needs.source.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ubuntu-material.tar
          archive: false
          overwrite: false
          if-no-files-found: error
          retention-days: 14
      - name: Record the exact candidate and source handoff identities
        env:
          ARCHIVE_SHA256: ${{ steps.archive.outputs.archive_sha256 }}
          MATERIAL_ARCHIVE_SHA256: ${{ steps.archive.outputs.material_archive_sha256 }}
          CANDIDATE_SHA256: ${{ steps.joined.outputs.candidate_record_sha256 }}
          CORE_SHA256: ${{ steps.material.outputs.core_receipt_sha256 }}
          GLEAM_SHA256: ${{ steps.material.outputs.gleam_receipt_sha256 }}
          JOIN_SHA256: ${{ steps.joined.outputs.dependency_inputs_sha256 }}
          ARTIFACT_ID: ${{ steps.retain.outputs.artifact-id }}
          MATERIAL_ARTIFACT_ID: ${{ steps.retain-material.outputs.artifact-id }}
        run: |
          {
            printf 'Candidate and source-evidence transport only; publication authority none\n\n'
            printf 'Architecture: %s\n\nSource tag: %s\n\nSource commit: %s\n\nSource record SHA-256: %s\n\n' "$TARGET_ARCHITECTURE" "$SOURCE_TAG" "$SOURCE_COMMIT" "$SOURCE_INPUTS_SHA256"
            printf 'Candidate record SHA-256: %s\n\nCore receipt SHA-256: %s\n\nGleam receipt SHA-256: %s\n\nDependency join SHA-256: %s\n\n' "$CANDIDATE_SHA256" "$CORE_SHA256" "$GLEAM_SHA256" "$JOIN_SHA256"
            printf 'Candidate TAR SHA-256: %s\n\nSource-evidence TAR SHA-256: %s\n\nArtifact ID: %s\n\nSource-evidence artifact ID: %s\n\nRun: %s; attempt: %s\n' "$ARCHIVE_SHA256" "$MATERIAL_ARCHIVE_SHA256" "$ARTIFACT_ID" "$MATERIAL_ARTIFACT_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
