name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-platform:
    name: Phoenix platform and Svelte contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: frameshift_dev
          POSTGRES_PASSWORD: frameshift_local_only
          POSTGRES_DB: frameshift_platform_dev
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U frameshift_dev -d frameshift_platform_dev"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.11
          persist_github_token: false
      - name: Install server dependencies
        working-directory: apps/build-platform
        env:
          REFPATH_READ_TOKEN: ${{ secrets.REFPATH_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [ -z "$REFPATH_READ_TOKEN" ]; then
            echo "REFPATH_READ_TOKEN needs read-only access to the private runtime repository." >&2
            exit 1
          fi
          credential_header=$(printf 'x-access-token:%s' "$REFPATH_READ_TOKEN" | base64 -w 0)
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/refpath/refpath.git.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $credential_header" \
            mix deps.get --check-locked
      - name: Install frontend dependencies
        working-directory: apps/build-platform/assets
        run: npm ci
      - name: Check platform
        run: ./scripts/check platform
      - name: Check metric collection alerts
        run: ./scripts/check platform-observability

  core-and-renderer:
    name: Elixir core and Zig renderer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.11
          persist_github_token: false
      - name: Install Elixir dependencies
        working-directory: apps/core
        run: mix deps.get
      - name: Check repository policy
        run: ./scripts/check policy
      - name: Check immutable physical profiles
        run: ./scripts/check build-spec
      - name: Check Zig renderer
        run: ./scripts/check renderer
      - name: Check isolated native codec
        run: ./scripts/check codec
      - name: Check Elixir core
        run: ./scripts/check core
      - name: Check browser guide
        run: ./scripts/check guide
      - name: Check maintained documentation and API site
        run: ./scripts/check docs
      - name: Check release manifest verifier
        run: ./scripts/check release
      - name: Check portable release input custody
        run: ./scripts/check release-portable

  macos-shell:
    name: Swift macOS shell
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.11
          persist_github_token: false
      - name: Report Swift toolchain
        run: swift --version
      - name: Install Elixir dependencies
        working-directory: apps/core
        run: mix deps.get --check-locked
      - name: Check Swift shell
        run: ./scripts/check macos
      - name: Check native Mac release tools
        run: ./scripts/check mac-release
      - name: Check portable release input custody
        run: ./scripts/check release-portable
      - name: Check native codec on macOS
        run: ./scripts/check codec

  frame-receiver:
    name: Container frame receiver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.11
          persist_github_token: false
      - name: Install Elixir dependencies
        working-directory: apps/core
        run: mix deps.get
      - name: Check networked frame receiver
        run: ./scripts/check container
      - name: Check Linux peer credentials
        run: ./scripts/check linux-ipc
      - name: Check Linux Avahi discovery
        run: ./scripts/check linux-discovery
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Check Linux codec source cohort
        run: ./scripts/check linux-codec
